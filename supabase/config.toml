# Supabase project configuration for local development with the Supabase CLI
# (`supabase start`, needs Docker) and the reference for the hosted project.
# Only settings this project depends on are listed; everything else keeps the
# CLI defaults. Hosted-project settings (Site URL, redirect URLs, email) must
# ALSO be set in the dashboard — see docs/DEPLOYMENT.md.

project_id = "sette-giochi"

[api]
port = 54321

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# Where confirmation and recovery links send people back to.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/reset-password",
  "http://localhost:4173/auth/callback",
  "http://localhost:4173/reset-password",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
# New accounts must confirm their email before they can sign in.
enable_confirmations = true

[functions.submit-daily]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
