name: Tieni sveglio Supabase

# Free Supabase projects are paused after about a week without activity.
# Every three days this asks the database for the list of games — a tiny,
# read-only request with the public key — so the project stays awake even
# when nobody plays. It is a mitigation, not a guarantee: GitHub itself
# suspends scheduled workflows in repositories with no commits for 60 days.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the games table
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase non configurato: niente da fare."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/games?select=id" -H "apikey: $KEY")
          echo "Supabase ha risposto $status"
          test "$status" = "200"
