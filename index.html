<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Geist:wght@400;500;600;700&family=VT323&family=Outfit:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Unbounded:wght@500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Archivo:wdth,wght@75..100,400;75..100,600;75..100,800&family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Sette Giochi</title>
    <meta
      name="description"
      content="Sette rompicapo quotidiani in un unico posto: gioca, tieni le tue serie e scala l'archivio."
    />
    <script>
      // Apply the stored theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem("sgp-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
